<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NIGHTFALL">
<link rel="manifest" href="manifest.json">
<title>NIGHTFALL // 個人端末</title>
<style>
:root{--bg:#05060f;--panel:#0a0e22;--panel2:#070a18;--line:#22336e;--text:#d9f6ff;--muted:#7d8fc7;--cyan:#00f0ff;--mag:#ff2bd6;--acid:#d9ff3d;--red:#ff3860;--gold:#d9ff3d;--green:#3dffb8;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(ellipse 80% 50% at 15% -5%,#00f0ff14 0,transparent 55%),radial-gradient(ellipse 70% 45% at 90% 0,#ff2bd612 0,transparent 55%),radial-gradient(ellipse at bottom,#0a1030 0,var(--bg) 55%);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;min-height:100vh;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(#00f0ff09 1px,transparent 1px),linear-gradient(90deg,#00f0ff09 1px,transparent 1px);background-size:42px 42px}
body::after{content:"";position:fixed;inset:0;z-index:55;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 2px,#00f0ff06 2px 3px,transparent 3px 4px)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:var(--text);background:#0b1130;border:1px solid #2b3f7f;padding:11px 13px;min-height:44px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:box-shadow.15s,background.15s}
button:active{transform:scale(.98)}
button.primary{background:#04222b;border-color:var(--cyan);color:#aefcff;box-shadow:0 0 12px #00f0ff30,inset 0 0 14px #00f0ff14}
button.danger{border-color:var(--mag);color:#ffc7f4;background:#2b0a26;box-shadow:0 0 12px #ff2bd626,inset 0 0 14px #ff2bd612}
button.small{padding:7px 10px;min-height:36px;font-size:12px}
input,textarea,select{width:100%;background:#04060f;border:1px solid #24356b;color:var(--text);padding:12px;outline:none;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 10px #00f0ff45}
textarea{resize:vertical;min-height:80px}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px;font-family:var(--mono);letter-spacing:1px}
.wrap{max-width:760px;margin:auto;padding:0 15px;position:relative;z-index:1}
.top{padding:calc(16px + env(safe-area-inset-top)) 0 12px;border-bottom:1px solid var(--line);background:#05060fd9;box-shadow:0 1px 18px #00f0ff14;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:11px}
.sigil{width:43px;height:43px;border:1px solid var(--cyan);display:grid;place-items:center;color:var(--cyan);font-size:22px;background:#00f0ff0d;box-shadow:0 0 14px #00f0ff40,inset 0 0 10px #00f0ff18;clip-path:polygon(50% 0,100% 25%,86% 78%,50% 100%,14% 78%,0 25%)}
.brand h1{font-size:17px;letter-spacing:3px;margin:0;font-family:var(--mono);text-shadow:0 0 10px #00f0ff66}
.sub{color:var(--muted);font-size:10px;letter-spacing:2px;font-family:var(--mono)}
.status{margin-left:auto;text-align:right;font:10px var(--mono);color:var(--green);text-shadow:0 0 8px #3dffb866}
main{padding-top:16px}
.eyebrow{font:11px var(--mono);letter-spacing:2px;color:var(--cyan);margin:4px 0 12px;text-shadow:0 0 8px #00f0ff55}
.page-title{font-size:23px;letter-spacing:1px;margin:0 0 4px;position:relative;text-shadow:0 0 14px #00f0ff30}
.page-title::before,.page-title::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;overflow:hidden;pointer-events:none}
.page-title::before{color:var(--mag);z-index:-1;animation:glitch-a 2.6s infinite steps(2,end)}
.page-title::after{color:var(--cyan);z-index:-2;animation:glitch-b 3.1s infinite steps(2,end)}
@keyframes glitch-a{0%,86%{transform:none;clip-path:inset(0 0 0 0);opacity:0}88%{transform:translate(-2px,1px);clip-path:inset(12% 0 55% 0);opacity:.8}92%{transform:translate(2px,-1px);clip-path:inset(60% 0 8% 0);opacity:.8}96%,100%{transform:none;opacity:0}}
@keyframes glitch-b{0%,80%{transform:none;opacity:0}82%{transform:translate(2px,0);clip-path:inset(35% 0 30% 0);opacity:.7}86%{transform:translate(-2px,1px);clip-path:inset(5% 0 78% 0);opacity:.7}90%,100%{transform:none;opacity:0}}
.desc{color:var(--muted);font-size:13px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.panel{background:linear-gradient(160deg,#0b1030,#060818);border:1px solid var(--line);padding:14px;margin-bottom:12px;box-shadow:inset 0 0 24px #00f0ff08,0 0 16px #00000088;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.panel h3{font-size:13px;margin:0 0 10px;color:#bfe9ff;letter-spacing:1px;font-family:var(--mono)}
.metric{font-size:27px;font-weight:700;color:var(--cyan);letter-spacing:1px;font-family:var(--mono);text-shadow:0 0 12px #00f0ff77}
.tiny{font-size:11px;color:var(--muted)}
.tag{display:inline-block;border:1px solid #2b3f7f;padding:3px 7px;font-size:10px;color:#a9c6ff;margin:2px;font-family:var(--mono);clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
.tag.red{border-color:var(--mag);color:#ff9de2}
.tag.gold{border-color:#5c6b14;color:var(--acid)}
.tag.alert{background:var(--acid);border-color:var(--acid);color:#0a0f00;font-weight:700;box-shadow:0 0 10px #d9ff3d88;animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.45}}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:9px}
.item{border:1px solid #27356b;padding:12px;background:#070b1d;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.item-title{font-weight:650;margin-bottom:5px}
.item p{margin:4px 0;color:#a9bbdd;font-size:12px;white-space:pre-wrap}
.item.done{opacity:.56}
.item.done.item-title{text-decoration:line-through}
.item.overdue{border-color:var(--acid);border-left:4px solid var(--acid);box-shadow:inset 0 0 20px #d9ff3d12,0 0 12px #d9ff3d22}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.formgrid.full{grid-column:1/-1}
.empty{border:1px dashed #2b3f7f;padding:20px;text-align:center;color:var(--muted);font-size:13px}
.meter{height:6px;background:#101736;overflow:hidden;margin-top:9px}
.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mag));box-shadow:0 0 8px #00f0ff66}
.quote{border-left:2px solid var(--mag);background:#ff2bd60a;padding:8px 12px;color:#f3d9f7;font-size:13px}
.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#05060ff5;backdrop-filter:blur(16px);border-top:1px solid var(--line);box-shadow:0 -1px 18px #00f0ff14;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:760px;margin:auto}
.nav button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 4px;font-size:12px;background:#0a0e22;border-color:#22336e;color:#8fa5d9}
.nav button.active{background:#04222b;border-color:var(--cyan);color:#aefcff;box-shadow:inset 0 0 18px #00f0ff22,0 0 10px #00f0ff30}
.nav.ico{font-size:16px}
.nav.navlabel{white-space:nowrap}
.notice{border:1px solid #5c6b14;background:#141603;padding:12px;color:#eef7b0;font-size:12px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.toast{position:fixed;z-index:80;left:16px;right:16px;bottom:125px;background:#04222b;border:1px solid var(--cyan);box-shadow:0 0 18px #00f0ff44;padding:12px;text-align:center;display:none;font-family:var(--mono);font-size:13px}
.redacted{background:#000;color:#000;border:1px solid #223;cursor:pointer;padding:0 4px}
.redacted.revealed{background:#2b0a26;color:#ffc3f2;border-color:var(--mag)}
.seal{font-size:42px;color:var(--cyan);text-align:center;margin:10px;text-shadow:0 0 18px #00f0ff88}
.line{height:1px;background:#22336e;margin:14px 0;box-shadow:0 0 6px #00f0ff22}
.muted{color:var(--muted)}
.success{color:var(--green)}
.warning{color:var(--acid)}
.mono{font-family:var(--mono)}
.ratiobar{display:flex;height:10px;border:1px solid var(--line);overflow:hidden;margin:8px 0 4px;background:#04060f}
.ratiobar span{display:block;height:100%}
.chip{display:inline-block;border:1px solid var(--mag);color:#ffb7ef;padding:3px 9px;font-size:11px;margin:2px;font-family:var(--mono);border-radius:999px;background:#ff2bd60d;box-shadow:0 0 8px #ff2bd622}
.insight{border:1px solid #6e2363;background:linear-gradient(160deg,#170a24,#0a0618);padding:12px;margin-top:10px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));box-shadow:inset 0 0 20px #ff2bd60d}
.insight h4{margin:0 0 8px;font-size:12px;color:#ff9de2;font-family:var(--mono);letter-spacing:1px}
.insight p{margin:6px 0;color:#e8d9ff;font-size:12px}
.lamp{width:26px;height:26px;border-radius:50%;border:2px solid #2b3f7f;background:#0a0e22;flex:none;transition:background.05s,box-shadow.05s}
.lamp.on{background:var(--cyan);border-color:#aefcff;box-shadow:0 0 18px var(--cyan),0 0 38px #00f0ff66}
#flashFx{position:fixed;inset:0;z-index:40;pointer-events:none;background:radial-gradient(ellipse at center,#00f0ff30 0,transparent 70%);opacity:0}
@media(min-width:600px){.nav{border:1px solid var(--line);border-bottom:0;left:50%;transform:translateX(-50%);width:100%;padding-left:18px;padding-right:18px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.page-title::before,.page-title::after{display:none}.tag.alert{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap brand"><div class="sigil" id="brandSigil">✧</div><div><h1 id="brandName">NIGHTFALL</h1><div class="sub">PERSONAL INTELLIGENCE TERMINAL</div></div><div class="status">● SECURE CHANNEL<br><span id="clock">--:--:--</span></div></div></header>
<main class="wrap" id="app"></main>
<nav class="nav" id="nav" aria-label="メインメニュー"></nav>
<div id="flashFx"></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const defaults={org:"NIGHTFALL",operator:"PHANTOM",mission:"世界の均衡を監視し、静かに介入する。",crest:"✧",missions:[
{id:1,title:"観測記録を整理せよ",priority:"中",due:"",plan:"観測データを確認し、重要事項を3点に整理する。",success:"要点を3点記録",done:false,created:Date.now()},
{id:2,title:"暗号通信の動作確認",priority:"低",due:"",plan:"暗号化と復号の動作を確認する。",success:"送受信テスト完了",done:false,created:Date.now()}
],subjects:[],logs:[],docs:[
{id:1,title:"プロトコル：ECLIPSE",level:"極秘",body:"作戦開始前に目的・期限・成功条件を定義すること。"},
{id:2,title:"観測者の心得",level:"機密",body:"観測事実と推測を混同しない。根拠のない断定は情報汚染である。"}
],active:"home",nextId:3};
let state;
try{state={...defaults,...JSON.parse(localStorage.getItem("nightfall-state")||"{}")}}catch{state={...defaults}}
if(!state.missions)state.missions=defaults.missions;if(!state.subjects)state.subjects=[];if(!state.logs)state.logs=[];if(!state.docs)state.docs=defaults.docs;
let page="home", filter="all", cipherResult="", sortMode="reg", docQuery="";
const navItems=[["home","⌂","司令室"],["missions","▤","任務管理"],["people","◎","人物分析局"],["cipher","⌁","極秘通信室"],["archive","▣","機密文書庫"],["settings","⚙","組織設定"]];
function save(){localStorage.setItem("nightfall-state",JSON.stringify(state))}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function stamp(){return new Date().toLocaleString("ja-JP",{hour12:false})}
function log(action,detail=""){state.logs.unshift({at:stamp(),action,detail});state.logs=state.logs.slice(0,100);save()}
function toast(t){let el=$("#toast");el.textContent=t;el.style.display="block";setTimeout(()=>el.style.display="none",2300)}
function go(p){page=p;stopMorse();render();window.scrollTo({top:0,behavior:"smooth"})}
function rate(){let n=state.missions.length;return n?Math.round(state.missions.filter(m=>m.done).length/n*100):0}
function todayStr(){return new Date().toISOString().slice(0,10)}
function isOverdue(m){return!m.done&&m.due&&m.due<todayStr()}
function overdue(){return state.missions.filter(isOverdue).length}
const flavorLines=["観測される者は、すでに観測を始めている。","沈黙は拒絶ではない。次の一手を隠すための幕だ。","小さな違和感を記録せよ。未来はそこから分岐する。","予定外の事象こそ、最重要情報となる。","力を誇示するな。結果だけが世界を書き換える。","未完了の任務は、夢の中でも追跡してくる。"];
function oracle(){let act=state.missions.filter(m=>!m.done).length,ov=overdue(),r=rate(),subs=state.subjects.length,docs=state.docs.length;
let scan=`観測網スキャン完了 ― 未完了任務 ${act} 件 / 期限超過 ${ov} 件 / 達成率 ${r}% / 観測対象 ${subs} 名 / 封印文書 ${docs} 件。`;
let read=ov>0?`期限超過が ${ov} 件検出された。影は濃くなっている。最優先で回収せよ。`:act===0?"未完了任務ゼロ。完全な静寂だ。次の作戦の種をまく好機である。":r>=80?"達成率は高水準。網は安定している。この静けさの中で、次の一手を仕込め。":`進行中の任務が ${act} 件ある。焦るな。一つずつ、確実に潰していけ。`;
let fl=flavorLines[Math.floor(Math.random()*flavorLines.length)];
return `${scan} ${read} ― ${fl}`}
function nav(){ $("#nav").innerHTML=navItems.map(([id,ico,label])=>`<button class="${page===id?"active":""}" onclick="go('${id}')"><span class="ico">${ico}</span><span class="navlabel">${label}</span></button>`).join("")}
function shell(kicker,title,desc,body){return `<div class="eyebrow">${kicker}</div><h2 class="page-title" data-text="${title}">${title}</h2><p class="desc">${desc}</p>${body}`}
function missionCard(m){let od=isOverdue(m);return `<article class="item ${m.done?"done":""} ${od?"overdue":""}"><div class="row between"><div class="item-title">${esc(m.title)}</div><span><span class="tag ${m.priority==="高"?"red":m.priority==="最重要"?"red": "gold"}">${esc(m.priority)}脅威</span>${od?'<span class="tag alert">⚠ 期限超過</span>':""}</span></div><p>作戦期限：${m.due?(od?`<span style="color:var(--acid);font-weight:700">${esc(m.due)}</span>`:esc(m.due)):"未設定"}　/　${m.done?'<span class="success">完了</span>':'<span class="warning">進行中</span>'}</p>${m.plan?`<p>${esc(m.plan)}</p>`:""}${m.success?`<p>成功条件：${esc(m.success)}</p>`:""}<div class="row" style="margin-top:9px">${m.done?`<button class="small" onclick="toggleMission(${m.id})">未完了に戻す</button>`:`<button class="small primary" onclick="toggleMission(${m.id})">✓ 任務達成</button>`}<button class="small" onclick="editPlan(${m.id})">作戦計画</button><button class="small danger" onclick="deleteMission(${m.id})">破棄</button></div></article>`}
function emergencyTarget(){let overs=state.missions.filter(isOverdue).sort((a,b)=>a.due<b.due?-1:1);if(overs.length)return{kind:"overdue",m:overs[0]};let act=state.missions.filter(m=>!m.done);if(act.length){let pri={"最重要":0,"高":1,"中":2,"低":3};act.sort((a,b)=>((pri[a.priority]??2)-(pri[b.priority]??2))||((a.due||"9999")<(b.due||"9999")?-1:1));return{kind:"active",m:act[0]}}return null}
function home(){let active=state.missions.filter(m=>!m.done);let tgt=emergencyTarget();return shell("COMMAND CENTER // 00","司令室","すべての事象は、記録された瞬間から制御可能になる。",`
<div class="panel"><div class="row between"><div><div class="tiny">OPERATIVE CODENAME</div><div style="font-size:22px;letter-spacing:3px">${esc(state.operator||"PHANTOM")}</div><span class="tag">階級：${rank()}</span></div><div class="seal">${esc(state.crest||"✧")}</div></div><div class="line"></div><div class="tiny">組織指令</div><div>${esc(state.mission)}</div></div>
<div class="grid"><div class="panel"><div class="tiny">進行中の任務</div><div class="metric">${active.length}</div></div><div class="panel"><div class="tiny">作戦成功率</div><div class="metric">${rate()}%</div><div class="meter"><span style="width:${rate()}%"></span></div></div><div class="panel"><div class="tiny">期限超過</div><div class="metric" style="color:${overdue()?"var(--red)":"var(--green)"};text-shadow:0 0 12px currentColor">${overdue()}</div></div><div class="panel"><div class="tiny">記録ログ</div><div class="metric">${state.logs.length}</div></div></div>
<div class="panel"><div class="row between"><h3>本日のデイリーブリーフィング</h3><span class="tag">${new Date().toLocaleDateString("ja-JP")}</span></div><p class="tiny">未完了任務：${active.length}件 / 期限超過：${overdue()}件 / 達成率：${rate()}%</p>${active.slice(0,3).map(m=>`<div class="row" style="margin:8px 0"><span class="tag ${m.priority==="高"?"red":"gold"}">${esc(m.priority)}</span><span>${esc(m.title)}</span></div>`).join("")||'<p class="success">現在、未完了任務なし。よくやった、エージェント。</p>'}<button class="primary" style="width:100%;margin-top:8px" onclick="go('missions')">任務管理を開く →</button></div>
<div class="panel"><h3>🔮 オラクル // ORACLE</h3><div class="quote" id="oracleText">${oracle()}</div><button class="small" style="margin-top:10px" onclick="$('#oracleText').textContent=oracle()">再解析</button></div>
<div class="panel"><h3>緊急指令</h3><p class="tiny">${tgt?(tgt.kind==="overdue"?`現在、期限超過の任務が ${overdue()} 件存在する。最優先ターゲット：『${esc(tgt.m.title)}』`:`進行中の任務『${esc(tgt.m.title)}』を最優先ターゲットとして検出。`):"未完了の任務は存在しない。受信時は定型の緊急指令を生成する。"}</p><button class="danger" style="width:100%" onclick="emergency()">⚠ 緊急指令を受信</button></div>
<div class="panel"><h3>直近の行動ログ</h3>${state.logs.slice(0,4).map(l=>`<p class="tiny mono">${esc(l.at)} — ${esc(l.action)} ${esc(l.detail)}</p>`).join("")||'<p class="tiny">記録はまだない。</p>'}</div>`)}
function rank(){let n=state.missions.filter(m=>m.done).length;return n>=20?"S級執行官":n>=10?"上級工作員":n>=5?"特務工作員":n>=1?"観測者":"候補生"}
function missions(){let arr=state.missions.filter(m=>filter==="all"||(filter==="active"&&!m.done)||(filter==="done"&&m.done));let pri={"最重要":0,"高":1,"中":2,"低":3};
if(sortMode==="due")arr.sort((a,b)=>((a.due||"9999-99-99")<(b.due||"9999-99-99")?-1:(a.due||"9999-99-99")>(b.due||"9999-99-99")?1:0)||(b.created-a.created));
else if(sortMode==="threat")arr.sort((a,b)=>((pri[a.priority]??2)-(pri[b.priority]??2))||(b.created-a.created));
return shell("MISSION CONTROL // 01","任務管理","ToDoなどという俗称は不要だ。これは任務である。",`

<div class="tiny" style="margin-top:10px">黒塗り表示の文字をタップすると、隠された内容を確認できる。</div>`)}
function settings(){return shell("ORGANIZATION PROFILE // 05","組織設定","組織の名、紋章、使命。すべては自ら定義する。",`
<div class="panel"><div class="seal" id="previewCrest">${esc(state.crest)}</div><form onsubmit="saveSettings(event)"><label>組織名</label><input id="org" required maxlength="40" value="${esc(state.org)}"><label>コードネーム</label><div class="row"><input id="operator" maxlength="30" value="${esc(state.operator)}"><button type="button" class="small" onclick="generateCode()">自動生成</button></div><label>組織の使命</label><textarea id="mission">${esc(state.mission)}</textarea><label>紋章</label><div class="grid three">${["✧","☾","◈","⌘","⛧","⚙","◉","△","✦","☄","♜","⟁"].map(c=>`<button type="button" class="${state.crest===c?"primary":""}" onclick="selectCrest('${c}')">${c}</button>`).join("")}</div><button class="primary" style="width:100%;margin-top:14px">設定を保存</button></form></div>
<div class="panel"><h3>任務達成記録</h3><div class="metric">${state.missions.filter(m=>m.done).length}</div><p class="tiny">達成済み任務の累計 / 現在の階級：${rank()}</p><div class="line"></div><h3>データ管理</h3><p class="tiny">この端末のブラウザ内にデータを保存します。ブラウザデータを消去すると記録も消えます。</p><div class="row"><button style="flex:1" onclick="exportData()">データを書き出す</button><button class="danger" style="flex:1" onclick="resetData()">全記録を初期化</button></div><input type="file" id="importFile" accept="application/json" style="margin-top:10px" onchange="importData(event)"></div>
<div class="panel"><h3>端末ステータス</h3><p class="tiny">保存方式：端末内ストレージ（localStorage）</p><p class="tiny">任務：${state.missions.length} / 観測対象：${state.subjects.length} / 文書：${state.docs.length} / ログ：${state.logs.length}</p></div>`)}
function render(){nav();$("#app").innerHTML=({home,missions,people,cipher,archive,settings}[page]||home)();$("#brandName").textContent=state.org||"NIGHTFALL";$("#brandSigil").textContent=state.crest||"✧";save()}
function addMission(e){e.preventDefault();let m={id:state.nextId++,title:$("#mtitle").value.trim(),priority:$("#mpriority").value,due:$("#mdue").value,plan:$("#mplan").value.trim(),success:$("#msuccess").value.trim(),done:false,created:Date.now()};state.missions.unshift(m);log("任務登録",m.title);save();toast("任務を登録した");render()}
function toggleMission(id){let m=state.missions.find(x=>x.id===id);if(!m)return;m.done=!m.done;log(m.done?"任務達成":"任務を再開",m.title);save();if(m.done)toast("MISSION COMPLETE // 任務達成");render()}
function deleteMission(id){if(!confirm("この任務を破棄しますか？"))return;let m=state.missions.find(x=>x.id===id);state.missions=state.missions.filter(x=>x.id!==id);log("任務破棄",m?.title||"");save();render()}
function editPlan(id){let m=state.missions.find(x=>x.id===id);if(!m)return;let v=prompt("作戦計画（手順）を編集",m.plan||"");if(v===null)return;m.plan=v;log("作戦計画を更新",m.title);save();render()}
function emergency(){let tgt=emergencyTarget();let title,plan,success="確認結果を行動ログに残す";
if(tgt&&tgt.kind==="overdue"){title=`回収指令：『${tgt.m.title}』の期限超過を解消せよ`;plan=`期限超過中の任務「${tgt.m.title}」（期限：${tgt.m.due}）の状況を確認し、本日中に完了させるか、再計画を記録すること。`;success="対象任務の完了、または再計画の記録"}
else if(tgt){title=`推進指令：『${tgt.m.title}』を本日中に前進させよ`;plan=`進行中の任務「${tgt.m.title}」について、本日中に具体的な進捗を1つ生み、結果を記録すること。`;success="対象任務の進捗を1つ記録"}
else{let choices=["未確認シグナルの発信源を記録せよ","機密文書庫の整合性を点検せよ","本日の行動ログを監査せよ","作戦計画の成功条件を再確認せよ","観測対象の記録を分類せよ"];title=""+choices[Math.floor(Math.random()*choices.length)];plan="状況を確認し、結果を記録する。"}
state.missions.unshift({id:state.nextId++,title,priority:"最重要",due:todayStr(),plan,success,done:false,created:Date.now()});log("緊急指令を受信",title);save();toast("緊急任務を登録しました");render()}
function addSubject(e){e.preventDefault();let s={id:state.nextId++,name:$("#sname").value.trim(),purpose:$("#spurpose").value.trim(),notes:[]};state.subjects.unshift(s);log("観測対象を登録",s.name);save();render()}
function addObservation(e,id){e.preventDefault();let s=state.subjects.find(x=>x.id===id),txt=$("#obs-"+id).value.trim(),type=$("#type-"+id).value;if(!s||!txt)return;s.notes.push({text:txt,type,at:stamp()});log("観測記録を追加",s.name);save();render()}
function deleteSubject(id){if(!confirm("対象とその記録を削除しますか？"))return;state.subjects=state.subjects.filter(s=>s.id!==id);log("観測対象を削除");save();render()}
function addDoc(e){e.preventDefault();state.docs.unshift({id:state.nextId++,title:$("#dtitle").value.trim(),level:$("#dlevel").value,body:$("#dbody").value.trim()});log("文書を封印",$("#dtitle").value.trim());save();render()}
function deleteDoc(id){if(!confirm("この文書を破棄しますか？"))return;state.docs=state.docs.filter(d=>d.id!==id);log("文書を破棄");save();render()}
function redactDoc(id){let d=state.docs.find(x=>x.id===id);if(!d)return;let v=prompt("黒塗りにする語句を入力（本文に存在する語句）");if(!v)return;if(!d.body.includes(v)){toast("指定語句が本文にありません");return}d.body=d.body.split(v).join("[["+v+"]]");save();render()}
function generateCode(){let a=["PHANTOM","ECLIPSE","RAVEN","OBSIDIAN","WRAITH","NOCTURNE","ZERO","VEIL","SPECTER","ONYX","VANTA","NOVA"];$("#operator").value=a[Math.floor(Math.random()*a.length)]+"-"+String(Math.floor(Math.random()*90)+10)}
function selectCrest(c){state.crest=c;$("#previewCrest").textContent=c;document.querySelectorAll("#app.grid button").forEach(b=>b.classList.toggle("primary",b.textContent===c))}
function saveSettings(e){e.preventDefault();state.org=$("#org").value.trim();state.operator=$("#operator").value.trim();state.mission=$("#mission").value.trim();log("組織設定を更新",state.org);save();render();toast("組織設定を保存しました")}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="nightfall-backup.json";a.click();URL.revokeObjectURL(url);toast("バックアップを出力しました")}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.missions||!d.docs)throw Error();state={...defaults,...d};save();render();toast("バックアップを復元しました")}catch{toast("読み込めないファイルです")}};r.readAsText(f)}
function resetData(){if(!confirm("すべての任務・観測記録・文書を削除します。本当によろしいですか？"))return;localStorage.removeItem("nightfall-state");state=JSON.parse(JSON.stringify(defaults));page="home";save();render();toast("初期化しました")}
setInterval(()=>{$("#clock").textContent=new Date().toLocaleTimeString("ja-JP",{hour12:false})},1000);
if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
render();
</script>
</body>
</html>
